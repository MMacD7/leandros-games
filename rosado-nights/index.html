"use strict";

(function(){
var BPM=92, STEP=60/BPM/4, BAR_STEPS=16, LOOP_BARS=16;
function mtof(m){return 440*Math.pow(2,(m-69)/12)}

 Em7:{pad:[52,55,59,62],root:40},
 Cmaj7:{pad:[52,55,59,60],root:36},
 Am7:{pad:[52,55,57,60],root:33},
 Bsus:{pad:[52,54,59,61],root:35},
 B:{pad:[51,54,59,63],root:35},
 D:{pad:[50,54,57,62],root:38},
 Bm7:{pad:[50,54,57,59],root:35}

 [16,74,4],[20,69,4],[24,66,8],
 [32,66,2],[34,69,2],[36,71,6],[42,74,6],
 [48,71,12],

 [80,78,6],[86,76,2],[88,74,8],

function makeEngine(ctx){

 /* shared noise */

 /* master chain: bus -> glue comp -> makeup -> limiter -> out */
 var bus=ctx.createGain();bus.gain.value=0.8;
 var lowcut=ctx.createBiquadFilter();lowcut.type='highpass';lowcut.frequency.value=28;
 var glue=ctx.createDynamicsCompressor();

 var lim=ctx.createDynamicsCompressor();

 var tilt=ctx.createBiquadFilter();tilt.type='highshelf';tilt.frequency.value=5000;tilt.gain.value=3;
 var lows=ctx.createBiquadFilter();lows.type='lowshelf';lows.frequency.value=90;lows.gain.value=-3;
 bus.connect(lowcut);lowcut.connect(lows);lows.connect(tilt);tilt.connect(glue);glue.connect(makeup);makeup.connect(lim);lim.connect(out);

 out.connect(analyser);out.connect(ctx.destination);

 var hall=ctx.createConvolver();hall.buffer=impulse(2.8,function(p){return Math.pow(1-p,3.2)});

 var hallOut=ctx.createGain();hallOut.gain.value=0.42;

 /* gated reverb for the snare */
 var gate=ctx.createConvolver();gate.buffer=impulse(0.34,function(p){return (1-p*0.35)*(p>0.93?(1-p)/0.07:1)});

 /* dotted-eighth ping-pong delay */
 var dIn=ctx.createGain(),dL=ctx.createDelay(2),dR=ctx.createDelay(2),fb=ctx.createGain(),dLP=ctx.createBiquadFilter();
 dL.delayTime.value=STEP*3;dR.delayTime.value=STEP*3;fb.gain.value=0.38;dLP.type='lowpass';dLP.frequency.value=2600;
 var merge=ctx.createChannelMerger(2),dOut=ctx.createGain();dOut.gain.value=0.32;

 var padSend=ctx.createGain();padSend.gain.value=0.5;padBus.connect(padSend);padSend.connect(hallIn);
 var bassBus=ctx.createGain();bassBus.gain.value=0.42;bassBus.connect(bus);
 var drumBus=ctx.createGain();drumBus.gain.value=0.9;drumBus.connect(bus);

  g.gain.setValueAtTime(peak,t+a+hold);g.gain.exponentialRampToValueAtTime(0.0001,t+a+hold+rel);

  o.frequency.setValueAtTime(230,t);o.frequency.exponentialRampToValueAtTime(170,t+0.08);
  og.gain.setValueAtTime(0.0001,t);og.gain.linearRampToValueAtTime(0.55*v,t+0.002);og.gain.exponentialRampToValueAtTime(0.0001,t+0.14);
  o.connect(og);og.connect(drumBus);og.connect(gateIn);o.start(t);o.stop(t+0.16);

 function hat(t,v,open){
  var d=open?0.16:0.035,n=noise(t,d+0.02),f=ctx.createBiquadFilter(),g=ctx.createGain();

 function bass(t,m,dur,v){

  f.frequency.setValueAtTime(150,t);f.frequency.linearRampToValueAtTime(320+1700*v,t+0.012);f.frequency.exponentialRampToValueAtTime(260,t+0.22);
  var end=env(g,t,0.004,0.9*v,dur*0.55,dur*0.5);
  [-9,9].forEach(function(dt){var o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=dt;o.connect(f);o.start(t);o.stop(end)});

  s.connect(sg);sg.connect(g);s.start(t);s.stop(end);

 }
 function pad(t,notes,dur){
  notes.forEach(function(m,i){
   var g=ctx.createGain(),end=env(g,t,0.35,0.5,Math.max(0.05,dur-0.4),0.9);
   var p=ctx.createStereoPanner?ctx.createStereoPanner():null;
   [-14,-4,11].forEach(function(dt){var o=ctx.createOscillator();o.type='sawtooth';o.frequency.value=mtof(m);o.detune.value=dt+(i-1.5)*2;
    o.connect(g);o.start(t);o.stop(end)});
   if(p){p.pan.value=(i/(notes.length-1)-0.5)*0.9;g.connect(p);p.connect(padLevel)}else g.connect(padLevel);
  });

  var o=ctx.createOscillator(),o2=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();

  var o=ctx.createOscillator(),o2=ctx.createOscillator(),f=ctx.createBiquadFilter(),g=ctx.createGain();

  var o2=osc('triangle',90,0,t,t+0.2),g2=G(0);g2.gain.setValueAtTime(0.35*v,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.16);

 function snare(t,v){
  var n=noise(t,0.35),g=G(0);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.8*v,t+0.002);g.gain.exponentialRampToValueAtTime(0.0001,t+0.28);
  var pk=F('peaking',3200,1);pk.gain.value=5;chain(n,F('highpass',700),pk,g);
  /* 80s clap layer */
  var c=noise(t,0.08),cg=G(0);[0,0.011,0.023].forEach(function(d){cg.gain.setValueAtTime(0.0001,t+d);cg.gain.linearRampToValueAtTime(0.6*v,t+d+0.001);cg.gain.exponentialRampToValueAtTime(0.02,t+d+0.01)});
  cg.gain.exponentialRampToValueAtTime(0.0001,t+0.07);chain(c,F('bandpass',1400,1.2),cg);
  var o=osc('triangle',200,0,t,t+0.2),og=G(0);o.frequency.setValueAtTime(210,t);o.frequency.exponentialRampToValueAtTime(160,t+0.1);
  og.gain.setValueAtTime(0.0001,t);og.gain.linearRampToValueAtTime(0.6*v,t+0.002);og.gain.exponentialRampToValueAtTime(0.0001,t+0.16);o.connect(og);

 }
 function hat(t,v){var n=noise(t,0.06),g=G(0);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.3*v,t+0.001);g.gain.exponentialRampToValueAtTime(0.0001,t+0.045);chain(n,F('highpass',8000),g,drumBus);var s=G(0.15);g.connect(s);s.connect(hallIn)}
 function crash(t){var n=noise(t,1.8),g=G(0);g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.22,t+0.003);g.gain.exponentialRampToValueAtTime(0.0001,t+1.7);chain(n,F('highpass',5000),g,drumBus);var s=G(0.4);g.connect(s);s.connect(hallIn)}
 function tom(t,f,v){
  var o=osc('sine',f,0,t,t+0.6),g=G(0);o.frequency.setValueAtTime(f*1.7,t);o.frequency.exponentialRampToValueAtTime(f,t+0.08);
  g.gain.setValueAtTime(0.0001,t);g.gain.linearRampToValueAtTime(0.85*v,t+0.003);g.gain.exponentialRampToValueAtTime(0.0001,t+0.5);
  var o2=osc('triangle',f*2,0,t,t+0.3),g2=G(0);g2.gain.setValueAtTime(0.25*v,t);g2.gain.exponentialRampToValueAtTime(0.001,t+0.2);
  o.connect(g);o2.connect(g2);[g,g2].forEach(function(x){x.connect(drumBus);x.connect(gateIn)});var s=G(0.4);g.connect(s);s.connect(hallIn);
 }
 function sweep(barPos){var ph=(barPos%S.sweepBars)/S.sweepBars;return S.cutLo*Math.pow(S.cutHi/S.cutLo,0.5-0.5*Math.cos(2*Math.PI*ph))}
 function bass(t,m,dur,v,cut){
  var f=mtof(m),end=t+dur+0.1,lp=F('lowpass',cut,5),g=G(0);
  lp.frequency.setValueAtTime(cut*1.8,t);lp.frequency.exponentialRampToValueAtTime(cut,t+0.09);
  env(g,t,0.005,v,dur*0.72,0.05);

  var sq=osc('square',f,-6,t,end),sg=G(0.35);sq.connect(sg);sg.connect(lp);

 }
 function pad(t,notes,dur,atk,rel,v){
  notes.forEach(function(m,i){
   var g=G(0),end=env(g,t,atk,0.5*v,Math.max(0.02,dur-atk),rel),p=ctx.createStereoPanner?ctx.createStereoPanner():null;
   [-15,-3,12].forEach(function(d,j){var o=osc('sawtooth',mtof(m),d,t,end);(j%2?chorus2:chorus).connect(o.detune);o.connect(g)});
   if(p){p.pan.value=(i/(notes.length-1)-0.5)*1.4;g.connect(p);p.connect(padIn)}else g.connect(padIn);
  });
 }
 /* robotic vocoder-ish voice: saw+pulse through a moving 3-formant filter bank */
 function voice(t,notes,dur,v0,v1,lv){
  var src=G(1),end=t+dur+0.4,f0=VOW[v0],f1=VOW[v1],g=G(0);
  notes.forEach(function(m){osc('sawtooth',mtof(m),-4,t,end).connect(src);var q=osc('square',mtof(m),5,t,end),qg=G(0.4);q.connect(qg);qg.connect(src)});
  [1,0.55,0.3].forEach(function(a,k){
   var b=F('bandpass',f0[k],[7,10,12][k]),ga=G(a*3.2);
   b.frequency.setValueAtTime(f0[k],t);b.frequency.linearRampToValueAtTime(f0[k],t+dur*0.15);b.frequency.exponentialRampToValueAtTime(f1[k],t+dur*0.85);
   chain(src,b,ga,g);
  });
  env(g,t,0.05,lv,Math.max(0.02,dur-0.05),0.25);g.connect(voiceBus);
 }
 var prevLead=0;
 function lead(t,m,dur){
  var f=mtof(m),from=prevLead||f;prevLead=f;var end=t+dur+0.5,g=G(0),lp=F('lowpass',1900,1);
  var o1=osc('square',f,0,t,end),o2=osc('sawtooth',f,7,t,end),g2=G(0.5);
  [o1,o2].forEach(function(o){o.frequency.setValueAtTime(from,t);o.frequency.exponentialRampToValueAtTime(f,t+0.09)});
  var vib=ctx.createOscillator(),vg=G(0);vib.frequency.value=5;vg.gain.setValueAtTime(0,t);vg.gain.linearRampToValueAtTime(12,t+Math.min(0.5,dur));
  vib.connect(vg);vg.connect(o1.detune);vg.connect(o2.detune);vib.start(t);vib.stop(end);
  o1.connect(lp);chain(o2,g2,lp);
  env(g,t,0.03,0.8,Math.max(0.02,dur-0.06),0.35);chain(lp,g,leadBus);
 }
 function fill(t,s,lb){
  if(S.fill==='toms'){if(s>=8&&on('drums'))tom(t,[150,150,120,120,95,95,80,80][s-8],0.6+0.05*(s-8))}
  else if(S.fill==='snare'){if(s>=12&&on('drums'))snare(t,[0.3,0.42,0.56,0.75][s-12])}
  else {if(s>=14&&on('drums'))snare(t,s===14?0.35:0.55)}
 }
 var INTRO=4;
 E.step=function(n,t){
  var bar=Math.floor(n/16),s=n%16,intro=bar<INTRO,lb=intro?bar:(bar-INTRO)%16,secB=!intro&&lb>=8;
  var sec=secB?'B':'A',bars=secB?S.B:S.A,bi=lb%8,ch=bars[bi],prev=bi?bars[bi-1]:null;
  E.lastBar=lb;
  /* bass pulse: straight 8ths, one note per chord */
  var dropBass=(!intro&&lb===15&&s>=12&&S.fill!=='toms');
  if(s%2===0&&!dropBass&&on('bass'))bass(t,ch.b,ST*2,(s%4===0?1:0.85)*(intro&&bar<1?0.8:1),sweep(bar+s/16));
  /* pads */
  if(!(intro&&bar<2)&&on('pad')){
   if(S.padMode==='hold'){
    if(s===0&&(bi===0||prev!==ch||intro&&bar===2)){var run=1;while(bi+run<8&&bars[bi+run]===ch&&!(intro&&bar+run>=INTRO))run++;pad(t,ch.p,ST*16*run,S.padAtk,S.padRel,1)}
   } else if(S.stabs.indexOf(s)>=0)pad(t,ch.p,ST*(s===0?3:2),S.padAtk,S.padRel,s===0?1:0.8);
  }
  /* drums */
  if(on('drums')){
   if(intro){if(bar>=2&&s===0)kick(t,0.9);if(bar===INTRO-1)fill(t,s,lb)}
   else{
    if(S.kick[sec][s]==='x')kick(t,s===0?1:0.85);
    if(S.snare[sec][s]==='x')snare(t,1);
    if(S.hat[sec][s]==='x')hat(t,(s%4===2)?1:0.6);
    if(lb===7||lb===15)fill(t,s,lb);
    if(S.crash&&s===0&&(lb===0||lb===8))crash(t);
   }
  }
  /* vocoder voice */
  if(!intro&&on('voice')){
   var vp=S.voice[sec];
   for(var i=0;i<vp.length;i++)if(vp[i][0]===lb%2&&vp[i][1]===s)voice(t,ch.v,vp[i][2]*ST,vp[i][3],vp[i][4],secB?S.voiceB:1);

  if(!intro&&on('lead')){

   for(var j=0;j<list.length;j++)if(list[j][0]===ss)lead(t,list[j][1],list[j][2]*ST);

 if(S.ext)S.ext(E,{ctx:ctx,S:S,ST:ST,G:G,F:F,osc:osc,chain:chain,on:on,bus:bus,hallIn:hallIn,drumBus:drumBus,bassBus:bassBus,
  bass:bass,pad:pad,snare:snare,curve:curve,nb:nb,sweep:sweep});

 E.dispose=function(){lfos.forEach(function(o){try{o.stop()}catch(e){}});try{out.disconnect()}catch(e){}};
 return E;
}

var TRACKS=[
 {id:'npSoloVoice',label:'Main Theme',name:'Rosado Nights (Neon Pursuit + Voice)',make:function(c){return makeNight(c,SONGS.npSoloVoice)}},
 {id:'pursuit',label:'Neon Pursuit',name:'Classic',make:function(c){return makeNight(c,SONGS.pursuit)}},
 {id:'npSolo',label:'Variation A',name:'Neon Pursuit + Solo',make:function(c){return makeNight(c,SONGS.npSolo)}},
 {id:'npDrop',label:'Variation B',name:'Neon Pursuit + Drop',make:function(c){return makeNight(c,SONGS.npDrop)}},
 {id:'night',label:'Option 1',name:'Night Drive',make:function(c){return makeNight(c,SONGS.night)}},
 {id:'ocean',label:'Option 3',name:'Ocean Drive 3AM',make:function(c){return makeNight(c,SONGS.ocean)}},
 {id:'orig',label:'Original',name:'Rosado Theme',make:makeEngine}
];
function trackIndex(id){for(var i=0;i<TRACKS.length;i++)if(TRACKS[i].id===id)return i;return 0}

/* offline render for testing: returns a Promise<AudioBuffer> */
window.RosadoTheme={TRACKS:TRACKS.map(function(t){return t.id}),
 render:function(id,seconds,only){
  var OAC=window.OfflineAudioContext||window.webkitOfflineAudioContext;
  var ctx=new OAC(2,Math.ceil(44100*seconds),44100),e=TRACKS[trackIndex(id)].make(ctx);
  if(only){e.only=only;if(e.bypass)e.bypass()}
  var go=function(){for(var n=0,t=0.05;t<seconds;n++,t+=e.stepDur)e.step(n,t);return ctx.startRendering()};
  return e.ready?e.ready.then(go):go();
 }};

/* ---------- live player with lookahead scheduler ---------- */
var btn=document.getElementById('play'),now=document.getElementById('now'),picks=[].slice.call(document.querySelectorAll('.pick'));
var ctx=null,eng=null,cur=0,nextT=0,stepN=0,timer=null,playing=false,AHEAD=0.15;
function schedule(){
 if(!ctx||!eng)return;
 var ahead=document.hidden?1.6:AHEAD;
 if(nextT<ctx.currentTime)nextT=ctx.currentTime+0.02;
 while(nextT<ctx.currentTime+ahead){eng.step(stepN,nextT);stepN++;nextT+=eng.stepDur}
}
function setUI(){
 btn.textContent=playing?'❚❚ PAUSE':'▶ PLAY MUSIC';btn.setAttribute('aria-pressed',playing?'true':'false');
 picks.forEach(function(p,i){p.setAttribute('aria-pressed',i===cur?'true':'false');p.classList.toggle('on',i===cur&&playing)});
 var T=TRACKS[cur];
 now.textContent=playing?'♫ Now playing: '+T.label+' · '+T.name:(eng?'Paused · '+T.label+' · '+T.name:'Pick a theme, then turn it up!');
}
function ensureCtx(){
 if(ctx)return true;
 try{if(navigator.audioSession)navigator.audioSession.type='playback'}catch(e){}
 var AC=window.AudioContext||window.webkitAudioContext;
 if(!AC){now.textContent='Sorry, this browser can’t play the music.';return false}
 try{ctx=new AC({latencyHint:'playback'})}catch(e){ctx=new AC()}
 /* iOS unlock: play a silent buffer inside the tap */
 var sb=ctx.createBufferSource();sb.buffer=ctx.createBuffer(1,1,22050);sb.connect(ctx.destination);sb.start(0);
 window.__rosadoCtx=ctx;return true;
}
function startTimer(){if(!timer)timer=setInterval(schedule,25)}
function stopTimer(){clearInterval(timer);timer=null}
function startTrack(i){
 if(!ensureCtx())return;
 ctx.resume();
 if(eng){var old=eng;try{old.out.gain.setTargetAtTime(0,ctx.currentTime,0.04)}catch(e){}setTimeout(function(){old.dispose()},450)}
 cur=i;eng=TRACKS[i].make(ctx);bins=null;stepN=0;nextT=ctx.currentTime+0.08;
 playing=true;window.__rosadoTrack=TRACKS[i].id;setUI();schedule();startTimer();
}
function pause(){playing=false;stopTimer();ctx.suspend();setUI()}
function resume(){ctx.resume();playing=true;setUI();schedule();startTimer()}
btn.addEventListener('click',function(){
 if(!eng)return startTrack(cur);
 if(playing)pause();else resume();
});
picks.forEach(function(p,i){p.addEventListener('click',function(){
 if(eng&&i===cur){if(playing)pause();else resume();return}
 startTrack(i);
})});
document.addEventListener('visibilitychange',function(){if(playing)schedule()});
/* if iOS interrupts audio (phone call etc), reflect it */
setInterval(function(){if(ctx&&playing&&ctx.state==='interrupted'){playing=false;stopTimer();setUI()}},1000);
setUI();

/* ---------- neon sun + grid visualizer ---------- */
var cv=document.getElementById('viz'),g2=cv.getContext('2d');
var reduce=window.matchMedia&&matchMedia('(prefers-reduced-motion: reduce)').matches;
var W=0,H=0,DPR=1,bins=null,lvl=0;
function size(){DPR=Math.min(window.devicePixelRatio||1,2);W=cv.clientWidth;H=cv.clientHeight;cv.width=Math.round(W*DPR);cv.height=Math.round(H*DPR);draw(0)}
function draw(ts){
 g2.setTransform(DPR,0,0,DPR,0,0);g2.clearRect(0,0,W,H);
 var hz=H*0.34, cx=W/2;
 /* sun */
 var R=Math.min(W*0.26,H*0.42)*(1+lvl*0.07);
 var sg=g2.createLinearGradient(0,hz-R,0,hz);sg.addColorStop(0,'#ffd84a');sg.addColorStop(0.55,'#ff6a9e');sg.addColorStop(1,'#ff2bd6');
 g2.save();g2.globalAlpha=0.55+lvl*0.35;g2.shadowColor='#ff2bd6';g2.shadowBlur=30+lvl*40;
 g2.beginPath();g2.arc(cx,hz,R,Math.PI,2*Math.PI);g2.closePath();g2.fillStyle=sg;g2.fill();g2.restore();
 g2.save();g2.globalCompositeOperation='destination-out';
 for(var k=0;k<6;k++){var y=hz-R*0.08-k*R*0.14,hh=R*(0.075-k*0.01);if(hh>0)g2.fillRect(cx-R,y-hh,2*R,hh)}
 g2.restore();
 /* floor */
 var fg=g2.createLinearGradient(0,hz,0,H);fg.addColorStop(0,'rgba(40,8,70,.0)');fg.addColorStop(1,'rgba(20,4,40,.85)');
 g2.fillStyle=fg;g2.fillRect(0,hz,W,H-hz);
 var a=0.45+lvl*0.55;
 g2.lineWidth=1.5;g2.shadowBlur=8;
 /* horizon */
 g2.strokeStyle='rgba(255,43,214,'+(0.7+lvl*0.3)+')';g2.shadowColor='#ff2bd6';
 g2.beginPath();g2.moveTo(0,hz);g2.lineTo(W,hz);g2.stroke();
 /* vertical lines fanning */
 g2.strokeStyle='rgba(25,211,255,'+a*0.8+')';g2.shadowColor='#19d3ff';g2.beginPath();
 for(var i=-14;i<=14;i++){var xb=cx+i*W*0.11;g2.moveTo(cx+i*W*0.012,hz);g2.lineTo(xb,H)}
 g2.stroke();
 /* horizontal lines scrolling toward viewer at tempo (1 line per beat) */
 var beat=reduce?0:((ctx&&playing&&eng)?ctx.currentTime*eng.bpm/60:ts/1000*0.4);
 var ph=beat-Math.floor(beat);
 g2.strokeStyle='rgba(255,43,214,'+a+')';g2.shadowColor='#ff2bd6';g2.beginPath();
 for(var j=0;j<12;j++){var z=(j+ph)/12,y2=hz+(H-hz)*Math.pow(z,2.2);g2.moveTo(0,y2);g2.lineTo(W,y2)}
 g2.stroke();g2.shadowBlur=0;
}
function loop(ts){
 if(eng&&playing){
  if(!bins)bins=new Uint8Array(eng.analyser.frequencyBinCount);
  eng.analyser.getByteFrequencyData(bins);var s=0;for(var i=1;i<6;i++)s+=bins[i];
  var target=Math.max(0,(s/5-150)/105);lvl+=(target-lvl)*(target>lvl?0.6:0.12);
 }else lvl*=0.9;
 draw(ts);requestAnimationFrame(loop);
}
window.addEventListener('resize',size);size();
if(!reduce)requestAnimationFrame(loop);
})();
