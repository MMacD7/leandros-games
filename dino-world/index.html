<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, minimum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Dino World">
<meta name="theme-color" content="#2b9348">
<meta name="format-detection" content="telephone=no">
<meta http-equiv="Content-Security-Policy" content="default-src 'self'; img-src 'self' data: blob:; style-src 'self' 'unsafe-inline'; script-src 'self'; connect-src 'self'; media-src 'self'; frame-src 'none'; object-src 'none'; base-uri 'self'; form-action 'none'">
<title>Leandro's Dinosaur World</title>
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/icon-180.png">
<link rel="icon" type="image/png" sizes="192x192" href="icons/icon-192.png">
<link rel="stylesheet" href="css/style.css">
</head>
<body>
<canvas id="game"></canvas>

<!-- TITLE -->
<div id="title" class="screen">
  <div class="topbar">
    <div class="pill"><i data-icon="bone"></i><span class="bones-val">0</span></div>
    <button class="icon-btn mute" aria-label="Sound"></button>
  </div>
  <h1><span class="l1">Leandro's</span><span class="l2">Dinosaur World</span></h1>
  <div class="menu">
    <button id="b-island" class="big green" aria-label="Island"><i data-icon="palm"></i><span>Island</span></button>
    <button id="b-run" class="big orange" aria-label="Run"><i data-icon="run"></i><span>Run</span></button>
    <button id="b-dinos" class="big purple" aria-label="My Dinos"><i data-icon="egg"></i><span>Dinos</span></button>
  </div>
  <div id="next-unlock" class="next"></div>
</div>

<!-- COLLECTION -->
<div id="collection" class="screen hidden">
  <div class="topbar">
    <button class="icon-btn back" aria-label="Back"><i data-icon="back"></i></button>
    <h2>My Dinos</h2>
    <div class="pill"><i data-icon="bone"></i><span class="bones-val">0</span></div>
  </div>
  <div id="grid" class="grid"></div>
</div>

<!-- ISLAND HUD -->
<div id="hud-island" class="hud hidden">
  <div class="hud-top">
    <div class="bars">
      <div class="bar hp"><i data-icon="heart"></i><div class="track"><div class="fill"></div></div></div>
      <div class="bar food"><i class="food-icon" data-icon="meat"></i><div class="track"><div class="fill"></div></div></div>
      <div class="bar xp"><span class="stars"></span><div class="track"><div class="fill"></div></div></div>
    </div>
    <div class="hud-right">
      <div class="pill"><i data-icon="bone"></i><span class="bones-val">0</span></div>
      <canvas id="minimap" width="120" height="120"></canvas>
      <div class="col">
        <button class="icon-btn home" aria-label="Home"><i data-icon="home"></i></button>
        <button class="icon-btn mute" aria-label="Sound"></button>
      </div>
    </div>
  </div>
  <div id="joy-zone"><div id="joy-base"><div id="joy-knob"></div></div></div>
  <div class="actions">
    <button id="a-sprint" class="act small yellow" aria-label="Sprint"><i data-icon="bolt"></i><svg class="ring" viewBox="0 0 100 100"><circle cx="50" cy="50" r="46"/></svg></button>
    <button id="a-roar" class="act small blue" aria-label="Roar"><i data-icon="roar"></i></button>
    <button id="a-bite" class="act main red" aria-label="Bite"><i data-icon="bite"></i></button>
  </div>
</div>

<!-- RUNNER HUD -->
<div id="hud-run" class="hud hidden">
  <div class="hud-top">
    <div class="hearts"></div>
    <div class="score pill"><i data-icon="star"></i><span id="r-score">0</span></div>
    <div class="hud-right">
      <button class="icon-btn home" aria-label="Home"><i data-icon="home"></i></button>
      <button class="icon-btn mute" aria-label="Sound"></button>
    </div>
  </div>
  <div class="run-help"><div class="tap-hint"><i data-icon="up"></i></div><div class="tap-hint"><i data-icon="down"></i></div></div>
  <div class="actions">
    <button id="r-duck" class="act main red" aria-label="Duck and chomp"><i data-icon="down"></i></button>
  </div>
</div>

<!-- MODALS -->
<div id="over" class="modal hidden">
  <div class="card-big">
    <div class="ov-title"><i data-icon="star"></i><span id="ov-score">0</span></div>
    <div class="ov-best hidden">NEW BEST!</div>
    <div class="ov-row"><span class="ov-m">0 m</span></div>
    <div class="ov-row"><i data-icon="bone"></i><span id="ov-bones">+0</span></div>
    <div class="ov-btns">
      <button id="ov-home" class="big purple sm" aria-label="Home"><i data-icon="home"></i></button>
      <button id="ov-again" class="big orange sm" aria-label="Again"><i data-icon="replay"></i></button>
    </div>
  </div>
</div>
<div id="unlock" class="modal hidden">
  <div class="card-big">
    <div class="ul-title">NEW DINO!</div>
    <canvas id="ul-canvas" width="360" height="240"></canvas>
    <div class="ul-name"></div>
    <div class="ov-btns"><button id="ul-ok" class="big green sm" aria-label="OK"><i data-icon="check"></i></button></div>
  </div>
</div>
<div id="rotate" class="modal hidden">
  <div class="card-big">
    <i class="rot-icon" data-icon="rotate"></i>
    <div class="ov-btns"><button id="rot-ok" class="big green sm" aria-label="Play"><i data-icon="play"></i></button></div>
  </div>
</div>
<div id="banner" class="hidden"></div>

<script src="js/data.js"></script>
<script src="js/audio.js"></script>
<script src="js/art.js"></script>
<script src="js/island.js"></script>
<script src="js/runner.js"></script>
<script src="js/main.js"></script>
</body>
</html>
