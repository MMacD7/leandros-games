<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta http-equiv="Cache-Control" content="no-cache">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#0b0612">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Leandro's Games">
<meta name="description" content="Leandro's arcade of dinosaur games.">
<title>Leandro's Games</title>
<style>
*{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;background:#0c0520}
body{margin:0;min-height:100vh;min-height:100dvh;color:#fff;font-family:system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
 background:
  radial-gradient(70% 38% at 50% 0%,rgba(255,43,214,.30),transparent 70%),
  radial-gradient(60% 40% at 100% 60%,rgba(25,211,255,.14),transparent 70%),
  radial-gradient(60% 40% at 0% 80%,rgba(138,60,255,.18),transparent 70%),
  linear-gradient(180deg,#140630 0%,#0c0520 55%,#090318 100%);
 -webkit-tap-highlight-color:transparent;overflow-x:hidden;display:flex;flex-direction:column}
main.wrap{flex:1;width:100%}
/* synthwave horizon: soft sun glow + neon floor grid fixed behind everything (GPU-friendly transform scroll) */
.horizon{position:fixed;left:0;right:0;bottom:0;height:38vh;z-index:0;pointer-events:none;overflow:hidden;
 -webkit-mask-image:linear-gradient(transparent,#000 35%);mask-image:linear-gradient(transparent,#000 35%)}
.horizon::before{content:"";position:absolute;left:50%;top:-34%;width:min(70vw,520px);aspect-ratio:1;transform:translateX(-50%);border-radius:50%;
 background:radial-gradient(circle,rgba(255,140,90,.32),rgba(255,43,214,.16) 45%,transparent 70%)}
.horizon .line{position:absolute;left:0;right:0;top:0;height:2px;background:#ff2bd6;box-shadow:0 0 10px #ff2bd6,0 0 22px rgba(255,43,214,.6);opacity:.75}
.floor{position:absolute;left:-50%;right:-50%;top:0;bottom:0;perspective:220px;perspective-origin:50% 0}
.floor i{position:absolute;left:0;right:0;top:0;height:200%;transform-origin:50% 0;transform:rotateX(62deg);
 background-image:linear-gradient(rgba(25,211,255,.55) 2px,transparent 2px),linear-gradient(90deg,rgba(255,43,214,.45) 2px,transparent 2px);
 background-size:100% 46px,58px 100%;animation:drive 2.6s linear infinite;will-change:transform}
.hoops{position:relative;z-index:1;height:4px;background:linear-gradient(90deg,#19d3ff,#ff2bd6 50%,#19d3ff);box-shadow:0 0 12px rgba(255,43,214,.8),0 0 24px rgba(25,211,255,.5);opacity:.9}
.hoops.top{height:4px}
.wrap{position:relative;z-index:1;max-width:1080px;margin:0 auto;
 padding:28px max(18px,env(safe-area-inset-right)) calc(36px + env(safe-area-inset-bottom)) max(18px,env(safe-area-inset-left))}
header{text-align:center;margin:10px 0 26px}
.badge{display:inline-flex;align-items:center;gap:8px;font-weight:800;font-size:13px;letter-spacing:.22em;text-transform:uppercase;
 color:#bff6ff;padding:7px 14px;border:2px solid rgba(25,211,255,.8);border-radius:999px;background:rgba(25,211,255,.08);
 box-shadow:0 0 10px rgba(25,211,255,.45),inset 0 0 8px rgba(25,211,255,.25);text-shadow:0 0 6px rgba(25,211,255,.8)}
.badge .dot{width:9px;height:9px;border-radius:50%;background:#ff2bd6;box-shadow:0 0 10px #ff2bd6;animation:blink 1.6s ease-in-out infinite}
h1{margin:16px 0 8px;line-height:.95;font-weight:900;text-transform:uppercase;letter-spacing:.01em;font-size:clamp(46px,13vw,104px);
 font-family:Impact,"Arial Black","Helvetica Neue",system-ui,sans-serif}
h1 span{display:block}
/* neon tube lettering: pale core + coloured glow; flickers on once at load, then a slow gentle breathe (no strobe) */
h1 .l1{font-size:.6em;color:#e9fdff;
 text-shadow:0 0 3px #fff,0 0 10px #19d3ff,0 0 22px #19d3ff,0 0 42px rgba(25,211,255,.7);animation:on1 1.6s ease-out both}
h1 .l2{color:#ffe9fb;
 text-shadow:0 0 4px #fff,0 0 12px #ff2bd6,0 0 26px #ff2bd6,0 0 54px rgba(255,43,214,.75),0 6px 0 #3a0b4a;
 animation:on2 2s ease-out .3s both,breathe 5s ease-in-out 2.4s infinite}
.sub{margin:10px 0 0;font-size:clamp(16px,4.4vw,20px);font-weight:700;color:#cfe9ff;opacity:.92}
/* theme music toggle */
.music{margin-top:16px;display:inline-flex;align-items:center;gap:10px;min-height:48px;padding:0 18px 0 14px;border-radius:999px;cursor:pointer;
 font:800 15px/1 system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;letter-spacing:.06em;color:#fff;touch-action:manipulation;
 background:rgba(26,8,52,.72);border:2px solid #ff2bd6;box-shadow:0 4px 0 #2a0b4a,0 0 14px rgba(255,43,214,.55),0 0 30px rgba(25,211,255,.25);
 text-shadow:0 0 8px rgba(255,43,214,.9);-webkit-appearance:none;appearance:none;transition:transform .12s ease}
.music:active{transform:translateY(3px);box-shadow:0 1px 0 #2a0b4a,0 0 12px rgba(255,43,214,.5)}
.music:focus-visible{outline:4px solid #fff;outline-offset:4px}
.music[aria-pressed="true"]{border-color:#19d3ff;background:linear-gradient(180deg,rgba(255,43,214,.4),rgba(106,43,216,.5));
 box-shadow:0 4px 0 #2a0b4a,0 0 18px rgba(25,211,255,.6),0 0 36px rgba(255,43,214,.4)}
.music[hidden]{display:none}
.eq{display:inline-flex;align-items:flex-end;gap:3px;height:18px}
.eq b{display:block;width:4px;height:6px;border-radius:2px;background:#19d3ff;box-shadow:0 0 6px #19d3ff}
.music[aria-pressed="true"] .eq b{animation:eq .9s ease-in-out infinite}
.music[aria-pressed="true"] .eq b:nth-child(2){animation-delay:-.3s;background:#ff2bd6;box-shadow:0 0 6px #ff2bd6}
.music[aria-pressed="true"] .eq b:nth-child(3){animation-delay:-.6s}
.grid{display:grid;grid-template-columns:1fr;gap:20px}
@media (min-width:640px){.grid{gap:28px}}
.card{--c1:#2f7d32;--c2:#a0c43a;--glow:rgba(140,255,90,.55);--glow2:rgba(140,255,90,.3);position:relative;display:flex;flex-direction:column;min-height:96px;
 border-radius:24px;padding:3px;text-decoration:none;color:#fff;background:linear-gradient(135deg,var(--c1),var(--c2));
 box-shadow:0 10px 0 rgba(0,0,0,.45),0 0 16px var(--glow),0 0 40px var(--glow2);transition:transform .15s ease,box-shadow .15s ease;touch-action:manipulation}
/* neon glow pulse: a separate glow layer whose opacity breathes (cheap on phones: opacity only) */
.card::after{content:"";position:absolute;inset:-2px;border-radius:26px;pointer-events:none;z-index:-1;
 box-shadow:0 0 26px 2px var(--glow),0 0 64px 6px var(--glow2);opacity:.35;animation:pulse 4.5s ease-in-out infinite}
.card.rosado::after{animation-delay:-2.2s}
.card .in{flex:1;display:flex;flex-direction:column;border-radius:20px;overflow:hidden;background:#140b1c}
.art{position:relative;height:170px;display:grid;place-items:center;overflow:hidden;
 background:radial-gradient(circle at 50% 120%,var(--c2),transparent 70%),linear-gradient(180deg,#1d1030,#140b1c)}
.art svg{width:150px;height:150px;filter:drop-shadow(0 6px 0 rgba(0,0,0,.4));animation:bob 2.6s ease-in-out infinite}
.body{padding:16px 18px 18px;display:flex;flex-direction:column;gap:6px;flex:1}
.title{text-wrap:balance}.tag{text-wrap:pretty}
.title{font-size:23px;font-weight:900;line-height:1.1;letter-spacing:-.01em}
.tag{font-size:16px;line-height:1.35;color:#d9d2e9}
.play{margin-top:auto;align-self:flex-start;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:52px;padding:0 22px;margin-top:12px;
 border-radius:14px;font-weight:900;font-size:19px;letter-spacing:.06em;text-transform:uppercase;color:#1a0a00;
 background:linear-gradient(180deg,#ffe36a,#ff9d00);box-shadow:0 5px 0 #a24a00}
.card:hover{transform:translateY(-4px) rotate(-.4deg);box-shadow:0 14px 0 rgba(0,0,0,.45),0 0 44px var(--glow)}
.card:active{transform:translateY(6px);box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 20px var(--glow)}
.card:focus-visible{outline:4px solid #fff;outline-offset:4px}
.robo{--c1:#ff7a1a;--c2:#ff2a3a;--glow:rgba(255,90,40,.6);--glow2:rgba(255,40,60,.32);
 background:linear-gradient(135deg,#ffd34d,#ff7a1a 40%,#ff2a3a)}
.robo .in{background:linear-gradient(180deg,#1d0f2e,#150a20)}
.robo .title{color:#fff;text-shadow:0 0 10px rgba(255,120,40,.65)}
.robo .play{box-shadow:0 5px 0 #a24a00,0 0 16px rgba(255,157,0,.55)}
/* ---- Rosado Nights feature card ---- */
.rosado{--c1:#ff2bd6;--c2:#19d3ff;--glow:rgba(255,43,214,.6);--glow2:rgba(25,211,255,.35);
 background:linear-gradient(135deg,#ff2bd6,#8a3cff 50%,#19d3ff)}
.rosado:hover{box-shadow:0 14px 0 rgba(0,0,0,.45),0 0 40px rgba(255,43,214,.8),0 0 70px rgba(25,211,255,.55)}
.rosado:active{box-shadow:0 4px 0 rgba(0,0,0,.45),0 0 20px rgba(255,43,214,.6),0 0 36px rgba(25,211,255,.4)}
.rosado .in{background:linear-gradient(180deg,#2a1150 0%,#1a0b33 55%,#0d1a3a 100%)}
.grid>*{min-width:0}
.poster{position:relative;aspect-ratio:4/5;overflow:hidden;background:#1a0b33}
.poster img{display:block;width:100%;height:100%;object-fit:cover;object-position:50% 12%}
.poster::after{content:"";position:absolute;inset:auto 0 0 0;height:22%;background:linear-gradient(transparent,#1a0b33)}
.soon-chip{position:absolute;top:12px;right:12px;z-index:1;font-size:12px;font-weight:900;letter-spacing:.18em;color:#fff;padding:6px 11px;border-radius:999px;
 background:rgba(20,6,40,.7);border:2px solid #19d3ff;box-shadow:0 0 12px rgba(25,211,255,.7)}
.rosado .title{font-size:26px;text-transform:uppercase;letter-spacing:.04em;color:#ffe9fb;
 text-shadow:0 0 6px #ff2bd6,0 0 16px #ff2bd6,0 0 30px rgba(255,43,214,.6);animation:sign 5s linear infinite}
.rosado .tag{color:#bfefff;font-weight:600}
/* "Neon Lights" sign under the card title: same pink neon tube as the Rosado Nights page, gentle glow only */
.rosado .neon-sub{margin-top:-2px;font-style:italic;font-weight:800;font-size:20px;line-height:1.05;letter-spacing:.08em;color:#ffe3fa;
 text-shadow:0 0 3px #fff,0 0 9px #ff2bd6,0 0 20px #ff2bd6,0 0 36px rgba(255,43,214,.55);animation:breathe 5s ease-in-out infinite}
.rosado .play{color:#fff;background:linear-gradient(180deg,#3a1670,#22104a);border:2px solid #19d3ff;
 box-shadow:0 5px 0 #0b0520,0 0 16px rgba(25,211,255,.55);text-shadow:0 0 8px #19d3ff}
@media (min-width:640px){
 .card.robo .in{flex-direction:row}
 .robo .art{width:min(42%,340px);flex:none;height:auto;min-height:260px;
  background:radial-gradient(circle at 50% 115%,var(--c2),transparent 72%),radial-gradient(circle at 30% 20%,rgba(255,204,0,.12),transparent 55%),linear-gradient(180deg,#1d1030,#140b1c)}
 .robo .art svg{width:min(230px,90%);height:auto;aspect-ratio:1}
 .card.robo .body{justify-content:center;padding:26px 30px;gap:10px}
 .robo .title{font-size:clamp(28px,4.2vw,44px)}
 .robo .tag{font-size:19px}
 .robo .play{margin-top:14px}
 .card.rosado .in{flex-direction:row}
 .rosado .poster{width:min(42%,340px);flex:none}
 .rosado .poster::after{display:none}
 .rosado .poster img{-webkit-mask-image:linear-gradient(90deg,#000 60%,transparent);mask-image:linear-gradient(90deg,#000 60%,transparent)}
 .rosado .poster{background:transparent}
 .card.rosado .body{position:relative;overflow:hidden;
  background:
      radial-gradient(circle at 78% 112%,#ffcf4a 0,#ff5fa2 16%,rgba(255,43,214,.35) 30%,transparent 46%)}
 .card.rosado .body::before{content:"";position:absolute;left:0;right:0;bottom:0;height:34%;pointer-events:none;
  background-image:linear-gradient(rgba(25,211,255,.35) 2px,transparent 2px),linear-gradient(90deg,rgba(255,43,214,.3) 2px,transparent 2px);
  background-size:100% 18px,44px 100%;-webkit-mask-image:linear-gradient(transparent,#000),linear-gradient(90deg,transparent,#000 35%);-webkit-mask-composite:source-in;mask-image:linear-gradient(transparent,#000),linear-gradient(90deg,transparent,#000 35%);mask-composite:intersect}
 .card.rosado .body>*{position:relative}
 .card.rosado .body{justify-content:center;padding:26px 30px;gap:10px}
 .rosado .title{font-size:clamp(28px,4.2vw,44px)}
 .rosado .tag{font-size:19px}
 .rosado .neon-sub{font-size:clamp(22px,3vw,30px)}
 .rosado .play{margin-top:14px}
}
@media (min-width:1000px){.wrap{max-width:940px}}
footer{margin-top:34px;text-align:center;font-weight:700;color:#b6a8d6;font-size:15px}
footer b{color:#ff7ae6;text-shadow:0 0 8px rgba(255,43,214,.7)}
@keyframes on1{0%{opacity:.1}12%{opacity:.9}20%{opacity:.25}38%{opacity:1}52%{opacity:.5}70%,100%{opacity:1}}
@keyframes on2{0%{opacity:.08}15%{opacity:.85}26%{opacity:.2}46%{opacity:1}60%{opacity:.55}78%,100%{opacity:1}}
@keyframes breathe{0%,100%{opacity:1}50%{opacity:.86}}
@keyframes pulse{0%,100%{opacity:.3}50%{opacity:.8}}
@keyframes drive{from{transform:rotateX(62deg) translateY(0)}to{transform:rotateX(62deg) translateY(46px)}}
@keyframes eq{0%,100%{height:5px}50%{height:18px}}
@keyframes bob{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
@keyframes blink{50%{opacity:.35}}
@keyframes sign{0%,18%,22%,62%,64%,100%{opacity:1}20%,63%{opacity:.7}}
@media (prefers-reduced-motion:reduce){*,*::before,*::after{animation:none!important;transition:none!important}.card::after{opacity:.5}}
</style>
</head>
<body>
<div class="horizon" aria-hidden="true"><div class="floor"><i></i></div><span class="line"></span></div>
<div class="hoops top" aria-hidden="true"></div>
<main class="wrap">
 <header>
  <div class="badge"><span class="dot"></span>Press Start</div>
  <h1><span class="l1">Leandro's</span><span class="l2">Games</span></h1>
  <p class="sub">Pick a game. Stomp, roar, and have fun!</p>
  <button class="music" id="music" type="button" aria-pressed="false" hidden><span class="eq" aria-hidden="true"><b></b><b></b><b></b></span><span class="lbl">♫ Play Rosado Nights theme</span></button>
 </header>

 <div class="grid">
  <a class="card robo" href="robo-dino-island/">
   <div class="in">
    <div class="art" aria-hidden="true">
     <svg viewBox="0 0 160 160">
      <ellipse cx="80" cy="146" rx="52" ry="7" fill="#000" opacity=".35"/>
      <rect x="40" y="70" width="70" height="56" rx="10" fill="#9aa3ad"/>
      <rect x="48" y="80" width="30" height="20" rx="4" fill="#3b4148"/>
      <circle cx="56" cy="90" r="4" fill="#ff3b1f"/><circle cx="70" cy="90" r="4" fill="#ffcc00"/>
      <rect x="78" y="30" width="56" height="42" rx="10" fill="#c3cbd3"/>
      <rect x="86" y="40" width="22" height="12" rx="3" fill="#111"/><rect x="90" y="43" width="10" height="6" rx="2" fill="#ff3b1f"/>
      <path d="M100 64h30v6h-30z" fill="#7a838c"/>
      <path d="M104 64v5M112 64v5M120 64v5" stroke="#fff" stroke-width="3"/>
      <path d="M98 30l6-14 4 14M114 30l6-12 4 12" fill="#e0321f"/>
      <path d="M40 104l-22 8 4-14 18-6z" fill="#7a838c"/>
      <rect x="52" y="124" width="14" height="18" rx="3" fill="#5f666e"/><rect x="86" y="124" width="14" height="18" rx="3" fill="#5f666e"/>
      <path d="M110 90l14 6-4 8-12-4" fill="#7a838c"/>
      <circle cx="24" cy="40" r="3" fill="#ffcc00"/><path d="M20 52l8-4M132 120l10-4M140 108l6 2" stroke="#ffcc00" stroke-width="3" stroke-linecap="round"/>
     </svg>
    </div>
    <div class="body">
     <div class="title">Leandro's Robo Dino Island</div>
     <div class="tag">Build robot dinos and battle on the island!</div>
     <span class="play">▶ Play</span>
    </div>
   </div>
  </a>

  <a class="card rosado" href="rosado-nights/" aria-label="Rosado Nights: hear the music">
   <div class="in">
    <div class="poster">
     <span class="soon-chip">NEW</span>
     <picture>
      <source srcset="rosado-nights/cover.webp" type="image/webp">
      <img src="rosado-nights/cover.jpg" width="600" height="900" alt="Rosado Nights poster: a man in a palm-print shirt under a neon Miami night sky" loading="lazy" decoding="async">
     </picture>
    </div>
    <div class="body">
     <div class="title">Rosado Nights</div>
     <div class="neon-sub">Neon Lights</div>
     <div class="tag">Neon nights. Palm trees. Hear the theme!</div>
     <span class="play">♫ Hear the Music</span>
    </div>
   </div>
  </a>
 </div>

 <footer>Made for <b>Leandro</b> · Ready, set, ROAR!</footer>
</main>
<div class="hoops" aria-hidden="true"></div>
<script src="rosado-nights/theme.js?v=2" defer></script>
<script>
/* theme music toggle: audio only starts from a tap (iOS rule); the music code is shared with rosado-nights/ */
window.addEventListener('DOMContentLoaded',function(){
 var T=window.RosadoTheme,b=document.getElementById('music');if(!b||!T||!T.supported)return;
 var lbl=b.querySelector('.lbl');b.hidden=false;
 function ui(p){b.setAttribute('aria-pressed',p?'true':'false');lbl.textContent=p?'❚❚ Pause Rosado Nights theme':'♫ Play Rosado Nights theme'}
 T.onChange(ui);b.addEventListener('click',function(){T.toggle()});
});
</script>
</body>
</html>
